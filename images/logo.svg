<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" class="h-8 w-auto">
  <defs>
    <linearGradient id="v2box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="box-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d8eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Geometric Cube / Shield Icon -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#box-fill)" stroke="url(#v2box-grad)" stroke-width="1.5"/>
    <!-- Cyber Lightning / V Symbol -->
    <path d="M12 14L20 28L28 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="20" r="2.5" fill="#38bdf8" />
  </g>
  <!-- Text V2BOX Pro -->
  <text x="56" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">V2BOX</text>
  <rect x="136" y="14" width="48" height="18" rx="6" fill="#571bc1" stroke="#a855f7" stroke-width="1"/>
  <text x="160" y="27" fill="#e9ddff" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" letter-spacing="1" text-anchor="middle">PRO</text>
</svg>
